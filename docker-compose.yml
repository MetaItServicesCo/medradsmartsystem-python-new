services:
  postgres:
    image: postgres:15-alpine
    container_name: medrad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medrad
      POSTGRES_PASSWORD: medrad123
      POSTGRES_DB: medrad_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medrad_network

  redis:
    image: redis:7-alpine
    container_name: medrad_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - medrad_network

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: medrad_coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=${TURN_REALM:-medcodesolution.com}
      - --user=${TURN_USERNAME:-medrad}:${TURN_PASSWORD:-change-this-turn-password}
      - --external-ip=${TURN_EXTERNAL_IP:-134.199.192.91}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - medrad_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrad_backend
    restart: unless-stopped
    # Keep a single worker on the current 2 GB host — a second worker roughly
    # doubles the backend's base memory and this box is already swapping. Raise
    # BACKEND_WORKERS only after the host has more RAM.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-1} --proxy-headers --forwarded-allow-ips=*
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://medrad:medrad123@postgres:5432/medrad_db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173","http://134.199.192.91:3000","http://134.199.192.91","http://medcodesolution.com","https://medcodesolution.com"]}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://medcodesolution.com}
      # Temporary QA simulation is opt-in. Square Sandbox is used for payment integration testing.
      - ENABLE_TEST_PAYMENTS=${ENABLE_TEST_PAYMENTS:-false}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT:-sandbox}
      - SQUARE_APPLICATION_ID=${SQUARE_APPLICATION_ID:-}
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN:-}
      - SQUARE_LOCATION_ID=${SQUARE_LOCATION_ID:-}
      - SQUARE_CURRENCY=${SQUARE_CURRENCY:-USD}
      - SQUARE_API_VERSION=${SQUARE_API_VERSION:-2026-07-15}
      - SQUARE_WEBHOOK_SIGNATURE_KEY=${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      - SQUARE_WEBHOOK_NOTIFICATION_URL=${SQUARE_WEBHOOK_NOTIFICATION_URL:-https://medcodesolution.com/api/v1/webhooks/square}
      - PAYMENT_DATA_ENCRYPTION_KEYS=${PAYMENT_DATA_ENCRYPTION_KEYS:-}
      - RENTAL_BILLING_INTERVAL_SECONDS=${RENTAL_BILLING_INTERVAL_SECONDS:-900}
    depends_on:
      - postgres
      - redis
    networks:
      - medrad_network

  rental_scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrad_rental_scheduler
    restart: unless-stopped
    command: python -m app.jobs.rental_billing_scheduler
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://medrad:medrad123@postgres:5432/medrad_db
      - REDIS_URL=redis://redis:6379/0
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://medcodesolution.com}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT:-sandbox}
      - SQUARE_APPLICATION_ID=${SQUARE_APPLICATION_ID:-}
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN:-}
      - SQUARE_LOCATION_ID=${SQUARE_LOCATION_ID:-}
      - SQUARE_CURRENCY=${SQUARE_CURRENCY:-USD}
      - SQUARE_API_VERSION=${SQUARE_API_VERSION:-2026-07-15}
      - PAYMENT_DATA_ENCRYPTION_KEYS=${PAYMENT_DATA_ENCRYPTION_KEYS:-}
      - RENTAL_BILLING_INTERVAL_SECONDS=${RENTAL_BILLING_INTERVAL_SECONDS:-900}
    depends_on:
      - postgres
      - redis
    networks:
      - medrad_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://medcodesolution.com/api/v1}
        VITE_STUN_URLS: ${VITE_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
        VITE_TURN_URLS: ${VITE_TURN_URLS:-turn:134.199.192.91:3478?transport=udp,turn:134.199.192.91:3478?transport=tcp}
        VITE_TURN_USERNAME: ${TURN_USERNAME:-medrad}
        VITE_TURN_CREDENTIAL: ${TURN_PASSWORD:-change-this-turn-password}
    container_name: medrad_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - medrad_network

volumes:
  postgres_data:

networks:
  medrad_network:
    driver: bridge
