services:
  postgres:
    image: postgres:15-alpine
    container_name: medrad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medrad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      POSTGRES_DB: ${POSTGRES_DB:-medrad_db}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medrad_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: medrad_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - medrad_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: medrad_coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=${TURN_REALM:-medcodesolution.com}
      - --user=${TURN_USERNAME:-medrad}:${TURN_PASSWORD:-change-this-turn-password}
      - --external-ip=${TURN_EXTERNAL_IP:-134.199.192.91}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - medrad_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrad_backend
    restart: unless-stopped
    init: true
    # Redis-backed WebSocket presence/fan-out keeps chat and call signaling
    # coherent across workers. Two workers suit the production 4-vCPU host;
    # raise this only alongside database pool and load-test validation.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-2} --proxy-headers --forwarded-allow-ips=* --no-access-log
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medrad}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@postgres:5432/${POSTGRES_DB:-medrad_db}
      - REDIS_URL=redis://redis:6379/0
      # Authentication tokens must use the deployment secret from the project
      # .env. Fail startup instead of silently using the development default.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be configured}
      - APP_ENV=${APP_ENV:-production}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      - RUN_STARTUP_MIGRATIONS=${RUN_STARTUP_MIGRATIONS:-false}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_ISSUER=${JWT_ISSUER:-medrad-api}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-medrad-web}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["https://medcodesolution.com","https://www.medcodesolution.com"]}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-["medcodesolution.com","www.medcodesolution.com","api.medcodesolution.com","localhost","127.0.0.1"]}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-600}
      - API_RATE_LIMIT_WINDOW_SECONDS=${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      - MAX_REQUEST_BODY_SIZE=${MAX_REQUEST_BODY_SIZE:-16777216}
      - SLOW_REQUEST_THRESHOLD_MS=${SLOW_REQUEST_THRESHOLD_MS:-1000}
      - REQUEST_LOG_SUCCESS_SAMPLE_RATE=${REQUEST_LOG_SUCCESS_SAMPLE_RATE:-0.10}
      - WEBSOCKET_CHANNEL_PREFIX=${WEBSOCKET_CHANNEL_PREFIX:-medrad:realtime}
      - WEBSOCKET_PRESENCE_TTL_SECONDS=${WEBSOCKET_PRESENCE_TTL_SECONDS:-45}
      - READ_CACHE_ENABLED=${READ_CACHE_ENABLED:-true}
      - READ_CACHE_PREFIX=${READ_CACHE_PREFIX:-medrad:cache}
      - READ_CACHE_DEFAULT_TTL_SECONDS=${READ_CACHE_DEFAULT_TTL_SECONDS:-30}
      - READ_CACHE_LOCK_SECONDS=${READ_CACHE_LOCK_SECONDS:-10}
      - READ_CACHE_LOCK_WAIT_MS=${READ_CACHE_LOCK_WAIT_MS:-150}
      - PAYMENT_PROOF_STORAGE_BACKEND=${PAYMENT_PROOF_STORAGE_BACKEND:-local}
      - PAYMENT_PROOF_S3_ENDPOINT_URL=${PAYMENT_PROOF_S3_ENDPOINT_URL:-}
      - PAYMENT_PROOF_S3_REGION=${PAYMENT_PROOF_S3_REGION:-}
      - PAYMENT_PROOF_S3_BUCKET=${PAYMENT_PROOF_S3_BUCKET:-}
      - PAYMENT_PROOF_S3_ACCESS_KEY_ID=${PAYMENT_PROOF_S3_ACCESS_KEY_ID:-}
      - PAYMENT_PROOF_S3_SECRET_ACCESS_KEY=${PAYMENT_PROOF_S3_SECRET_ACCESS_KEY:-}
      - PAYMENT_PROOF_S3_PREFIX=${PAYMENT_PROOF_S3_PREFIX:-payment-proofs}
      - PAYMENT_PROOF_S3_SERVER_SIDE_ENCRYPTION=${PAYMENT_PROOF_S3_SERVER_SIDE_ENCRYPTION:-}
      # These limits are per worker. With the default two workers the API has
      # the same approximate connection ceiling as the former single process.
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-8}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-8}
      - DATABASE_POOL_TIMEOUT_SECONDS=${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      - DATABASE_POOL_RECYCLE_SECONDS=${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://medcodesolution.com}
      # Temporary QA simulation is opt-in. Square Sandbox is used for payment integration testing.
      - ENABLE_TEST_PAYMENTS=${ENABLE_TEST_PAYMENTS:-false}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT:-sandbox}
      - SQUARE_APPLICATION_ID=${SQUARE_APPLICATION_ID:-}
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN:-}
      - SQUARE_LOCATION_ID=${SQUARE_LOCATION_ID:-}
      - SQUARE_CURRENCY=${SQUARE_CURRENCY:-USD}
      - SQUARE_API_VERSION=${SQUARE_API_VERSION:-2026-07-15}
      - SQUARE_WEBHOOK_SIGNATURE_KEY=${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      - SQUARE_WEBHOOK_NOTIFICATION_URL=${SQUARE_WEBHOOK_NOTIFICATION_URL:-https://medcodesolution.com/api/v1/webhooks/square}
      - PAYMENT_DATA_ENCRYPTION_KEYS=${PAYMENT_DATA_ENCRYPTION_KEYS:-}
      - RENTAL_BILLING_INTERVAL_SECONDS=${RENTAL_BILLING_INTERVAL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medrad_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  rental_scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrad_rental_scheduler
    restart: unless-stopped
    init: true
    command: python -m app.jobs.rental_billing_scheduler
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medrad}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@postgres:5432/${POSTGRES_DB:-medrad_db}
      - REDIS_URL=redis://redis:6379/0
      # Keep every backend process on the same deployment secret. Requiring the
      # value here prevents the scheduler from booting with a divergent default.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be configured}
      - APP_ENV=${APP_ENV:-production}
      - ENABLE_API_DOCS=false
      - RUN_STARTUP_MIGRATIONS=false
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["https://medcodesolution.com","https://www.medcodesolution.com"]}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-["medcodesolution.com","www.medcodesolution.com","api.medcodesolution.com","localhost","127.0.0.1"]}
      - DATABASE_POOL_SIZE=${SCHEDULER_DATABASE_POOL_SIZE:-3}
      - DATABASE_MAX_OVERFLOW=${SCHEDULER_DATABASE_MAX_OVERFLOW:-2}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://medcodesolution.com}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT:-sandbox}
      - SQUARE_APPLICATION_ID=${SQUARE_APPLICATION_ID:-}
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN:-}
      - SQUARE_LOCATION_ID=${SQUARE_LOCATION_ID:-}
      - SQUARE_CURRENCY=${SQUARE_CURRENCY:-USD}
      - SQUARE_API_VERSION=${SQUARE_API_VERSION:-2026-07-15}
      - PAYMENT_DATA_ENCRYPTION_KEYS=${PAYMENT_DATA_ENCRYPTION_KEYS:-}
      - RENTAL_BILLING_INTERVAL_SECONDS=${RENTAL_BILLING_INTERVAL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medrad_network

  payment_proof_ocr_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: python -m app.jobs.payment_proof_ocr_worker
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medrad}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@postgres:5432/${POSTGRES_DB:-medrad_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be configured}
      - APP_ENV=${APP_ENV:-production}
      - ENABLE_API_DOCS=false
      - RUN_STARTUP_MIGRATIONS=false
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["https://medcodesolution.com","https://www.medcodesolution.com"]}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-["medcodesolution.com","www.medcodesolution.com","api.medcodesolution.com","localhost","127.0.0.1"]}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://medcodesolution.com}
      - DATABASE_POOL_SIZE=${OCR_DATABASE_POOL_SIZE:-2}
      - DATABASE_MAX_OVERFLOW=${OCR_DATABASE_MAX_OVERFLOW:-1}
      - PAYMENT_DATA_ENCRYPTION_KEYS=${PAYMENT_DATA_ENCRYPTION_KEYS:-}
      - PAYMENT_PROOF_STORAGE_BACKEND=${PAYMENT_PROOF_STORAGE_BACKEND:-local}
      - PAYMENT_PROOF_S3_ENDPOINT_URL=${PAYMENT_PROOF_S3_ENDPOINT_URL:-}
      - PAYMENT_PROOF_S3_REGION=${PAYMENT_PROOF_S3_REGION:-}
      - PAYMENT_PROOF_S3_BUCKET=${PAYMENT_PROOF_S3_BUCKET:-}
      - PAYMENT_PROOF_S3_ACCESS_KEY_ID=${PAYMENT_PROOF_S3_ACCESS_KEY_ID:-}
      - PAYMENT_PROOF_S3_SECRET_ACCESS_KEY=${PAYMENT_PROOF_S3_SECRET_ACCESS_KEY:-}
      - PAYMENT_PROOF_S3_PREFIX=${PAYMENT_PROOF_S3_PREFIX:-payment-proofs}
      - PAYMENT_PROOF_S3_SERVER_SIDE_ENCRYPTION=${PAYMENT_PROOF_S3_SERVER_SIDE_ENCRYPTION:-}
      - AI_EXTRACTION_ENABLED=${AI_EXTRACTION_ENABLED:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_EXTRACTION_MODEL=${AI_EXTRACTION_MODEL:-claude-sonnet-5}
      - AI_EXTRACTION_TIMEOUT_SECONDS=${AI_EXTRACTION_TIMEOUT_SECONDS:-60}
      - AI_EXTRACTION_EXTERNAL_PROCESSING_ACKNOWLEDGED=${AI_EXTRACTION_EXTERNAL_PROCESSING_ACKNOWLEDGED:-false}
      - PAYMENT_PROOF_OCR_POLL_SECONDS=${PAYMENT_PROOF_OCR_POLL_SECONDS:-2}
      - PAYMENT_PROOF_OCR_BATCH_SIZE=${PAYMENT_PROOF_OCR_BATCH_SIZE:-4}
      - PAYMENT_PROOF_OCR_MAX_ATTEMPTS=${PAYMENT_PROOF_OCR_MAX_ATTEMPTS:-4}
      - PAYMENT_PROOF_OCR_LEASE_SECONDS=${PAYMENT_PROOF_OCR_LEASE_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medrad_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://medcodesolution.com/api/v1}
        VITE_STUN_URLS: ${VITE_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
        VITE_TURN_URLS: ${VITE_TURN_URLS:-turn:134.199.192.91:3478?transport=udp,turn:134.199.192.91:3478?transport=tcp}
        VITE_TURN_USERNAME: ${TURN_USERNAME:-medrad}
        VITE_TURN_CREDENTIAL: ${TURN_PASSWORD:-change-this-turn-password}
    container_name: medrad_frontend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medrad_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:

networks:
  medrad_network:
    driver: bridge
