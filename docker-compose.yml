services:
  postgres:
    image: postgres:15-alpine
    container_name: medrad_postgres
    environment:
      POSTGRES_USER: medrad
      POSTGRES_PASSWORD: medrad123
      POSTGRES_DB: medrad_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medrad_network

  redis:
    image: redis:7-alpine
    container_name: medrad_redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - medrad_network

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: medrad_coturn
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=${TURN_REALM:-medcodesolution.com}
      - --user=${TURN_USERNAME:-medrad}:${TURN_PASSWORD:-change-this-turn-password}
      - --external-ip=${TURN_EXTERNAL_IP:-134.199.192.91}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - medrad_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrad_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-1} --proxy-headers --forwarded-allow-ips=*
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://medrad:medrad123@postgres:5432/medrad_db
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173","http://134.199.192.91:3000","http://134.199.192.91","http://medcodesolution.com","https://medcodesolution.com"]}
    depends_on:
      - postgres
      - redis
    networks:
      - medrad_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://medcodesolution.com/api/v1}
        VITE_STUN_URLS: ${VITE_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
        VITE_TURN_URLS: ${VITE_TURN_URLS:-turn:134.199.192.91:3478?transport=udp,turn:134.199.192.91:3478?transport=tcp}
        VITE_TURN_USERNAME: ${TURN_USERNAME:-medrad}
        VITE_TURN_CREDENTIAL: ${TURN_PASSWORD:-change-this-turn-password}
    container_name: medrad_frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - medrad_network

volumes:
  postgres_data:

networks:
  medrad_network:
    driver: bridge
